name: Deploy UstaadPro API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy API to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts

            cd /var/www/vhosts/api.ustaadpro.pk

            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e node_modules/ -e uploads/ -e firebase-service-account.json -e .env

            npm install

            pm2 restart ustaadpro-api
            pm2 status ustaadpro-api
